# SPDX-License-Identifier: AGPL-3.0-only
[project]
name = "surefy-ml"
version = "0.0.0"
description = "SurefyOS ML service: document parsing and OCR (internal only)"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "docling[rapidocr]==2.133.0",
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "structlog==26.1.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "asgi-lifespan==2.1.0",
  "httpx==0.28.1",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
]

# docling needs torch. On Linux the CPU wheels come from the PyTorch index, so images do not
# carry several GB of CUDA libraries; the GPU image variant overrides this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "ASYNC", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Parametrized tests take many fixtures; fakes mirror the pool's `timeout` signature.
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLR0917", "ASYNC109"]
# `timeout` bounds work in a worker process, not the caller's own cancellation scope.
"src/surefy_ml/core/concurrency.py" = ["ASYNC109"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: loads real models or libraries"]
