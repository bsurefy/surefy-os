# SPDX-License-Identifier: AGPL-3.0-only
# Required checks for every pull request into develop or main, and for pushes to them.
name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title (it becomes the squash commit)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^A-Z].{0,90}$'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::Title must follow Conventional Commits, e.g. 'feat(chat): add folders'. Got: $TITLE"
            exit 1
          fi

  typescript:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: SPDX headers
        run: node .github/scripts/check-spdx.mjs
      - name: No private packages in public code
        run: node .github/scripts/check-private-imports.mjs
      - name: Translation keys match across locales
        run: node .github/scripts/check-i18n-parity.mjs
      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build
      - name: ML client matches apps/ml/openapi.json
        run: |
          pnpm --filter @surefy/ml-client generate
          git diff --exit-code -- packages/ml-client/src/generated \
            || { echo "::error::Run 'pnpm --filter @surefy/ml-client generate' and commit the result."; exit 1; }

  python:
    name: ML service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: openapi.json matches the code
        run: |
          uv run python -m surefy_ml.export_openapi > openapi.json
          git diff --exit-code -- openapi.json \
            || { echo "::error::Run 'uv run python -m surefy_ml.export_openapi > openapi.json' in apps/ml and commit the result."; exit 1; }
      # Model weights for the slow tests; the docling version in uv.lock decides which weights.
      - name: Cache model weights
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ml/.models
          key: ml-models-${{ hashFiles('apps/ml/uv.lock') }}
      - name: Download model weights
        if: steps.models.outputs.cache-hit != 'true'
        run: uv run docling-tools models download layout tableformer rapidocr -o .models
      - name: Tests, including the slow ones on real models
        run: uv run pytest
