# SPDX-License-Identifier: AGPL-3.0-only
# Contributor License Agreement check for outside pull requests (CONTRIBUTING.md, CLA.md).
# Signatures are stored in the cla-signatures branch of this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the SurefyOS CLA and I hereby sign it.'
    steps:
      - name: Check signatures
        # contributor-assistant/github-action v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/bsurefy/surefy-os/blob/main/CLA.md
          branch: cla-signatures
          allowlist: bsurefy,dependabot[bot],renovate[bot]
          custom-pr-sign-comment: I have read the SurefyOS CLA and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please sign the
            [SurefyOS Contributor License Agreement](https://github.com/bsurefy/surefy-os/blob/main/CLA.md)
            by replying to this pull request with the sentence below. You only sign once.
          lock-pullrequest-aftermerge: false
