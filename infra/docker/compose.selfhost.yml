# SPDX-License-Identifier: AGPL-3.0-only
# SurefyOS on one server: Caddy (TLS), workspace, api, worker, ml, Postgres (pgvector) and Redis.
# Configuration comes from .env next to this file; infra/scripts/install.sh writes it.
#
#   infra/scripts/install.sh                                       # first install
#   docker compose -f infra/docker/compose.selfhost.yml up -d      # start or upgrade
#
# Every service has an image (SUREFY_IMAGE_REGISTRY, SUREFY_VERSION) and a build section: a server
# without the repository pulls, a checkout builds with `docker compose ... build`.
name: surefy

x-api-image: &api-image
  image: ${SUREFY_IMAGE_REGISTRY:-ghcr.io/bsurefy}/surefy-api:${SUREFY_VERSION:-latest}
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile

# The api, worker and migrate services read the same configuration; the migrate step loads the
# whole of it. Service URLs are fixed here: they name containers, not anything an operator sets.
x-api-service: &api-service
  <<: *api-image
  env_file: .env
  environment:
    NODE_ENV: production
    ML_SERVICE_URL: http://ml:8000
    REDIS_URL: redis://redis:6379
    STORAGE_LOCAL_PATH: /data/storage
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SUREFY_DOMAIN: ${SUREFY_DOMAIN:?set SUREFY_DOMAIN in .env}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # The API signs file URLs with its public address and ml downloads them: inside the stack
        # that address resolves to Caddy, which serves the public certificate.
        aliases:
          - ${SUREFY_DOMAIN}
    depends_on:
      workspace:
        condition: service_healthy
      api:
        condition: service_healthy

  workspace:
    image: ${SUREFY_IMAGE_REGISTRY:-ghcr.io/bsurefy}/surefy-workspace:${SUREFY_VERSION:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/workspace.Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:4000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *api-service
    command: [node, dist/server.js]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    volumes:
      - files:/data/storage
    depends_on:
      files-permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy

  worker:
    <<: *api-service
    command: [node, dist/worker.js]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4001/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    volumes:
      - files:/data/storage
    depends_on:
      files-permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy

  # Applies the SQL migrations as surefy_owner; runs on every `up`, and does nothing when the
  # database is current. `docker compose run --rm migrate` runs it alone.
  migrate:
    <<: *api-service
    command: [node, dist/migrate.js]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # The files volume is created owned by root; the services run as uid 10001.
  files-permissions:
    <<: *api-image
    user: '0'
    command: [chown, '10001:10001', /data/storage]
    restart: 'no'
    volumes:
      - files:/data/storage

  ml:
    image: ${SUREFY_IMAGE_REGISTRY:-ghcr.io/bsurefy}/surefy-ml:${SUREFY_VERSION:-latest}
    build:
      context: ../../apps/ml
      dockerfile: ../../infra/docker/ml.Dockerfile
    restart: unless-stopped
    environment:
      ML_ENV: production
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?set ML_SERVICE_TOKEN in .env}
      ML_ALLOWED_DOWNLOAD_HOSTS: '["${SUREFY_DOMAIN}"]'
      ML_WORKERS: ${ML_WORKERS:-2}
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The two application roles and the database are created when the volume is first created.
      SUREFY_OWNER_PASSWORD: ${SUREFY_OWNER_PASSWORD:?set SUREFY_OWNER_PASSWORD in .env}
      SUREFY_APP_PASSWORD: ${SUREFY_APP_PASSWORD:?set SUREFY_APP_PASSWORD in .env}
      SUREFY_DATABASE: ${SUREFY_DATABASE:-surefy}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres:/surefy:ro
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  files:
  caddy-data:
  caddy-config:
